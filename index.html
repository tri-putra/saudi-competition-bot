<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saudi Undergraduate Competitions & Hackathons</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-emerald-800 text-white shadow-md py-6 px-4">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold tracking-tight">🇸🇦 Saudi Student Competitions</h1>
                <p class="text-emerald-100 mt-1 text-sm">Curated hackathons and academic events for undergrads in Computer Science, Science, & Engineering.</p>
            </div>
            <div class="mt-4 md:mt-0 text-xs bg-emerald-700 px-3 py-1.5 rounded-full text-emerald-200 border border-emerald-600">
                ✨ Automated by Gemini AI & GitHub Actions
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        <div id="loading" class="text-center py-16 text-gray-500 font-medium">Loading latest competitions...</div>
        <div id="competitions-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-6 text-center text-sm text-gray-500">
        <p>Built with Python, Google Gemini AI, Supabase, and Vercel.</p>
    </footer>

    <!-- Frontend Logic -->
    <script>
        // Use your Supabase Project URL and Public ANON Key (Safe for frontend)
        const SUPABASE_URL = 'https://meqigjwavgggehullgux.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_rcT8O4AfGOXiTNi6a3NikQ_lCAjEjcw';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadCompetitions() {
            const grid = document.getElementById('competitions-grid');
            const loading = document.getElementById('loading');

            try {
                const { data, error } = await supabaseClient
                    .from('competitions')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                loading.style.display = 'none';

                if (!data || data.length === 0) {
                    grid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-16">No competitions found right now. Check back soon!</p>';
                    return;
                }

                grid.innerHTML = data.map(item => `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex flex-col justify-between hover:shadow-md transition-shadow">
                        <div>
                            <div class="flex justify-between items-start gap-2 mb-3">
                                <span class="text-xs font-semibold px-2.5 py-1 bg-emerald-50 text-emerald-700 rounded-md">${item.organizer || 'Organizer'}</span>
                                <span class="text-xs text-gray-500 bg-gray-100 px-2 py-1 rounded">${item.location || 'Saudi Arabia'}</span>
                            </div>
                            <h3 class="text-xl font-bold text-gray-900 mb-2">${item.title}</h3>
                            <p class="text-gray-600 text-sm mb-4">${item.summary}</p>
                        </div>
                        <div class="border-t border-gray-100 pt-4 mt-4">
                            <div class="text-xs text-gray-500 mb-4 space-y-1.5">
                                <p>🎯 <span class="font-medium text-gray-700">Target:</span> ${item.target_audience}</p>
                                <p>📅 <span class="font-medium text-gray-700">Dates:</span> ${item.important_dates}</p>
                            </div>
                            <a href="${item.registration_link}" target="_blank" class="block w-full text-center bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-4 rounded-lg text-sm transition-colors">
                                Register / Learn More →
                            </a>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                console.error('Error fetching competitions:', err);
                loading.textContent = 'Failed to load competitions. Please check your Supabase public credentials.';
            }
        }

        loadCompetitions();
    </script>
</body>
</html>
